[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "video-pii"
version = "0.1.0"
description = "Video PII redaction pipeline using SCRFD and diffusion-based face anonymization"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Video PII Team"}
]
dependencies = [
    "numpy>=1.24.0",
    "opencv-python>=4.8.0",
    "pydantic>=2.0.0",
    "torch>=2.0.0",
    "mediapipe>=0.10.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
]
# SCRFD face detection via insightface
detection = [
    "insightface>=0.7.0",
    "onnxruntime>=1.15.0",
]
# GPU support for detection
detection-gpu = [
    "insightface>=0.7.0",
    "onnxruntime-gpu>=1.15.0",
]
# Face anonymization via diffusion (requires face_anon_simple repo)
anonymization = [
    "diffusers>=0.25.0",
    "transformers>=4.30.0",
    "accelerate>=0.20.0",
]
# Full pipeline with all dependencies
full = [
    "video-pii[detection,anonymization]",
]
full-gpu = [
    "video-pii[detection-gpu,anonymization]",
]

[project.scripts]
anonymize-video = "scripts.anonymize_video:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
